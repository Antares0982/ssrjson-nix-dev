name: "Cache Nix Flake Result (cachix)"
on:
  workflow_dispatch:
    inputs:
      do-update:
        description: 'Set to true to update and commit flake.lock'
        required: true
        default: true
        type: boolean
      new-branch:
        description: 'Set to true to push updates to a new branch'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - "dev"
  schedule:
    - cron: '0 11 * * *'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      do_update: ${{ steps.flags.outputs.do_update }}
      do_push_new_branch: ${{ steps.flags.outputs.do_push_new_branch }}
      branch_name: ${{ steps.update-branch.outputs.branch_name }}
      final_branch_name: ${{ steps.update-branch.outputs.final_branch_name }}
      update_sha: ${{ steps.update-branch.outputs.update_sha }}
      ssrjson_sha: ${{ steps.ssrjson.outputs.sha }}
    steps:
    - name: Set flags
      id: flags
      run: |
        echo "event: ${{ github.event_name }}"
        {
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "do_update=false"
            echo "do_push_new_branch=true"
          elif [ "${{ github.event_name }}" == "push" ]; then
            echo "do_update=false"
            echo "do_push_new_branch=false"
          else
            echo "do_update=${{ github.event.inputs.do-update }}"
            echo "do_push_new_branch=${{ github.event.inputs.new-branch }}"
          fi
        } >> "$GITHUB_OUTPUT"

    - name: Checkout
      uses: actions/checkout@v6
      with:
        token: '${{ secrets.GITHUB_TOKEN }}'

    - name: Test CI scripts
      run: python3 ./test_ci.py

    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: '${{ secrets.GITHUB_TOKEN }}'

    - name: Set nix daemon tmp path
      if: steps.flags.outputs.do_update == 'true' || steps.flags.outputs.do_push_new_branch == 'true'
      run: |
        sudo mkdir --parents /nix/tmp
        sudo chmod 777 /nix/tmp

        cat > override.conf <<EOF
        [Service]
        Environment="TMPDIR=/nix/tmp"
        EOF
        sudo mkdir /etc/systemd/system/nix-daemon.service.d/
        sudo mv override.conf /etc/systemd/system/nix-daemon.service.d/override.conf
        sudo systemctl daemon-reload
        sudo systemctl restart nix-daemon

    - name: Configure git credentials
      if: steps.flags.outputs.do_update == 'true' || steps.flags.outputs.do_push_new_branch == 'true'
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"

    - name: Pin ssrJSON main
      id: ssrjson
      run: |
        sha=$(git ls-remote --exit-code https://github.com/Antares0982/ssrJSON.git refs/heads/main | cut -f1)
        echo "sha=$sha" >> "$GITHUB_OUTPUT"

    - name: Prepare candidate update
      id: update-branch
      env:
        DO_UPDATE: ${{ steps.flags.outputs.do_update }}
        NEW_BRANCH: ${{ steps.flags.outputs.do_push_new_branch }}
      run: bash ./flake-update.sh prepare

  test-x86_64-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.prepare.outputs.update_sha }}
        token: '${{ secrets.GITHUB_TOKEN }}'
    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: '${{ secrets.GITHUB_TOKEN }}'
    - name: Setup cachix
      uses: cachix/cachix-action@v17
      with:
        name: antares0982
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: Test Nix Develop
      run: |
        ./devshell-test.sh
    - name: Checkout ssrJSON
      uses: actions/checkout@v6
      with:
        repository: Antares0982/ssrJSON
        ref: ${{ needs.prepare.outputs.ssrjson_sha }}
        path: ssrjson
        persist-credentials: false
    - name: Build ssrJSON wheels
      env:
        NIX_DEV_SHA: ${{ needs.prepare.outputs.update_sha }}
      run: bash ./ssrjson-test.sh ./ssrjson "$NIX_DEV_SHA"

  test-aarch64-linux:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.prepare.outputs.update_sha }}
        token: '${{ secrets.GITHUB_TOKEN }}'
    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: '${{ secrets.GITHUB_TOKEN }}'
    - name: Setup cachix
      uses: cachix/cachix-action@v17
      with:
        name: antares0982
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: Test Nix Develop
      run: |
        ./devshell-test.sh
    - name: Checkout ssrJSON
      uses: actions/checkout@v6
      with:
        repository: Antares0982/ssrJSON
        ref: ${{ needs.prepare.outputs.ssrjson_sha }}
        path: ssrjson
        persist-credentials: false
    - name: Build ssrJSON wheels
      env:
        NIX_DEV_SHA: ${{ needs.prepare.outputs.update_sha }}
      run: bash ./ssrjson-test.sh ./ssrjson "$NIX_DEV_SHA"

  test-aarch64-darwin:
    needs: prepare
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.prepare.outputs.update_sha }}
        token: '${{ secrets.GITHUB_TOKEN }}'
    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: '${{ secrets.GITHUB_TOKEN }}'
    - name: Setup cachix
      uses: cachix/cachix-action@v17
      with:
        name: antares0982
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: Test Nix Develop
      run: |
        ./devshell-test.sh
    - name: Checkout ssrJSON
      uses: actions/checkout@v6
      with:
        repository: Antares0982/ssrJSON
        ref: ${{ needs.prepare.outputs.ssrjson_sha }}
        path: ssrjson
        persist-credentials: false
    - name: Build ssrJSON wheels
      env:
        NIX_DEV_SHA: ${{ needs.prepare.outputs.update_sha }}
      run: bash ./ssrjson-test.sh ./ssrjson "$NIX_DEV_SHA"

  finalize-branch:
    needs: [prepare, test-x86_64-linux, test-aarch64-linux, test-aarch64-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: always() && needs.prepare.outputs.branch_name != ''
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.prepare.outputs.update_sha }}
    - name: Finalize candidate update
      env:
        PENDING_BRANCH: ${{ needs.prepare.outputs.branch_name }}
        FINAL_BRANCH: ${{ needs.prepare.outputs.final_branch_name }}
        UPDATE_SHA: ${{ needs.prepare.outputs.update_sha }}
        NEW_BRANCH: ${{ needs.prepare.outputs.do_push_new_branch }}
        PREPARE_RESULT: ${{ needs.prepare.result }}
        X86_RESULT: ${{ needs.test-x86_64-linux.result }}
        ARM_RESULT: ${{ needs.test-aarch64-linux.result }}
        MAC_RESULT: ${{ needs.test-aarch64-darwin.result }}
      run: bash ./flake-update.sh finalize
